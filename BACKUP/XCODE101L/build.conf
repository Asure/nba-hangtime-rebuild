# Minimal config - mounts current dir as C: drive

[sdl]
fullscreen = false
autolock = false

[dosbox]
memsize = 8

[cpu]
core               = dynamic
fpu                = false
cputype            = auto
cycles             = max 105%
turbo		   = true

[autoexec]
# Mount current directory as C:
mount c .
c:
# Add current tools directory to PATH
path=Z:\;C:\;C:\TOOLS
set TEMP=C:\
set TMP=C:\
